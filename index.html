<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mirko Cabrera | Video Editor</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #111111;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            padding: 50px 7%;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        header h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        header p {
            color: #aaaaaa;
            font-size: 18px;
        }

        .section-title {
            font-size: 24px;
            margin-bottom: 20px;
        }

        /* VIDEOS VERTICALES */

        .vertical-videos {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            max-width: 850px;
            margin: 0 auto 70px auto;
        }

        .vertical-videos video {
            width: 100%;
            aspect-ratio: 9 / 16;
            object-fit: cover;
            border-radius: 12px;
            background: #222;
            display: block;
        }

        /* VIDEOS HORIZONTALES */

        .horizontal-videos {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            width: 100%;
        }

        .youtube-video {
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 12px;
            overflow: hidden;
            background: #222;
        }

        .youtube-video iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* CONTACTO */

        .contact {
            text-align: center;
            margin-top: 100px;
            padding: 70px 20px;
            border-top: 1px solid #292929;
        }

        .contact h2 {
            font-size: 32px;
            margin-bottom: 12px;
        }

        .contact p {
            color: #aaaaaa;
            font-size: 17px;
            margin-bottom: 30px;
        }

        .contact-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .contact-button {
            display: inline-block;
            padding: 14px 28px;
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
            text-decoration: none;
            font-size: 16px;
            transition: 0.2s;
        }

        .contact-button:hover {
            background: white;
            color: #111;
        }

        footer {
            text-align: center;
            margin-top: 20px;
            color: #777;
            font-size: 14px;
        }

        /* CELULAR */

        @media (max-width: 700px) {

            body {
                padding: 35px 20px;
            }

            header h1 {
                font-size: 32px;
            }

            header p {
                font-size: 16px;
            }

            .vertical-videos {
                gap: 12px;
                margin-bottom: 50px;
            }

            .horizontal-videos {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .contact {
                margin-top: 70px;
                padding: 50px 10px;
            }

            .contact h2 {
                font-size: 28px;
            }

            .contact-buttons {
                flex-direction: column;
                align-items: center;
            }

            .contact-button {
                width: 220px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Mirko Cabrera</h1>
        <p>Video Editor</p>
    </header>


    <main>

        <!-- SHORT FORM -->

        <h2 class="section-title">Short Form</h2>

        <section class="vertical-videos">

            <video controls playsinline preload="metadata">
                <source src="vertical1.mp4" type="video/mp4">
                Tu navegador no puede reproducir este video.
            </video>

            <video controls playsinline preload="metadata">
                <source src="vertical2.mp4" type="video/mp4">
                Tu navegador no puede reproducir este video.
            </video>

        </section>


        <!-- LONG FORM -->

        <h2 class="section-title">Long Form</h2>

        <section class="horizontal-videos">

            <!-- HORIZONTAL 1 -->

            <div class="youtube-video">
                <iframe
                    src="https://www.youtube.com/embed/sH1zEXQh7QA"
                    title="Horizontal Video 1"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen>
                </iframe>
            </div>


            <!-- HORIZONTAL 2 -->

            <div class="youtube-video">
                <iframe
                    src="https://www.youtube.com/embed/_ZO6MntCjOo"
                    title="Horizontal Video 2"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen>
                </iframe>
            </div>

        </section>


        <!-- CONTACTO -->

        <section class="contact">

            <h2>¿Trabajamos juntos?</h2>

            <p>Estoy disponible para nuevos proyectos de edición.</p>

            <div class="contact-buttons">

                <!-- INSTAGRAM -->

                <a
                    class="contact-button"
                    href="https://www.instagram.com/mirko.cabrera/"
                    target="_blank">
                    Instagram
                </a>


                <!-- EMAIL -->

                <a
                    class="contact-button"
                    href="mailto:cabreramirko11@gmail.com">
                    Email
                </a>


                <!-- WHATSAPP -->

                <a
                    class="contact-button"
                    href="https://wa.me/5491155651999"
                    target="_blank">
                    WhatsApp
                </a>

            </div>

        </section>

    </main>


    <footer>
        © 2026 Mirko Cabrera — Video Editor
    </footer>

</body>
</html>
