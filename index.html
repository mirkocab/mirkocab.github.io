<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mirko Cabrera | Video Editor</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #111111;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            padding: 50px 7%;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        header h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        header p {
            color: #aaaaaa;
            font-size: 18px;
        }

        .section-title {
            font-size: 24px;
            margin-bottom: 20px;
        }

        /* VIDEOS VERTICALES */

        .vertical-videos {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            max-width: 850px;
            margin: 0 auto 70px auto;
        }

        .vertical-videos video {
            width: 100%;
            aspect-ratio: 9 / 16;
            object-fit: cover;
            border-radius: 12px;
            background: #222;
            display: block;
        }

        /* VIDEOS HORIZONTALES */

        .horizontal-videos {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            width: 100%;
        }

        .horizontal-videos video {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            border-radius: 12px;
            background: #222;
            display: block;
        }

        footer {
            text-align: center;
            margin-top: 70px;
            color: #777;
            font-size: 14px;
        }

        /* CELULAR */

        @media (max-width: 700px) {

            body {
                padding: 35px 20px;
            }

            header h1 {
                font-size: 32px;
            }

            header p {
                font-size: 16px;
            }

            .vertical-videos {
                gap: 12px;
                margin-bottom: 50px;
            }

            .horizontal-videos {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Mirko Cabrera</h1>
        <p>Video Editor</p>
    </header>


    <main>

        <h2 class="section-title">Short Form</h2>

        <section class="vertical-videos">

            <video controls playsinline preload="metadata">
                <source src="vertical1.mp4" type="video/mp4">
                Tu navegador no puede reproducir este video.
            </video>

            <video controls playsinline preload="metadata">
                <source src="vertical2.mp4" type="video/mp4">
                Tu navegador no puede reproducir este video.
            </video>

        </section>


        <h2 class="section-title">Long Form</h2>

        <section class="horizontal-videos">

            <video controls playsinline preload="metadata">
                <source src="horizontal1.mp4" type="video/mp4">
                Tu navegador no puede reproducir este video.
            </video>

            <video controls playsinline preload="metadata">
                <source src="horizontal2.mp4" type="video/mp4">
                Tu navegador no puede reproducir este video.
            </video>

        </section>

    </main>


    <footer>
        © 2026 Mirko Cabrera — Video Editor
    </footer>

</body>
</html>
